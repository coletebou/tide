name: CI

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

# A newer push to a branch cancels its older runs; every master run finishes.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/master' }}

jobs:
  core:
    name: TideCore tests
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Show toolchain
        run: xcodebuild -version && swift --version
      - name: Test
        run: swift test --package-path Packages/TideCore

  app:
    name: Build the iOS app
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate the project
        run: xcodegen generate
      - name: Install the Metal toolchain (SwiftTerm's renderer)
        run: xcodebuild -downloadComponent MetalToolchain || true
      - name: Build for the iOS Simulator
        run: >
          xcodebuild -project Tide.xcodeproj -scheme Tide
          -destination 'generic/platform=iOS Simulator'
          -skipPackagePluginValidation -skipMacroValidation
          CODE_SIGNING_ALLOWED=NO build
